<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Submit a detailed review of our products, including rating, features, installation date, and personal comments.">
  <meta name="author" content="Martin Walusoma">
  <title>Product Review Form</title>
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>

  <header>
    <h1>Product Review Form</h1>
    <p>Please fill out the form below to submit your product review.</p>
  </header>

  <main>
    <form method="get" action="review.html">

      <!-- Product Name -->
      <label for="product">Product Name <span>*</span></label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <!-- Overall Rating -->
      <fieldset>
        <legend>Overall Rating <span>*</span></legend>
        <label><input type="radio" name="rating" id="rating1" value="1" required> 1 ☆</label>
        <label><input type="radio" name="rating" id="rating2" value="2" required> 2 ☆</label>
        <label><input type="radio" name="rating" id="rating3" value="3" required> 3 ☆</label>
        <label><input type="radio" name="rating" id="rating4" value="4" required> 4 ☆</label>
        <label><input type="radio" name="rating" id="rating5" value="5" required> 5 ☆</label>
      </fieldset>

      <!-- Date of Installation -->
      <label for="date">Date of Installation <span>*</span></label>
      <input type="date" id="date" name="date" required>

      <!-- Useful Features -->
      <fieldset>
        <legend>Useful Features</legend>
        <label><input type="checkbox" id="feature1" name="features" value="Ease of Use"> Ease of Use</label>
        <label><input type="checkbox" id="feature2" name="features" value="Design"> Design</label>
        <label><input type="checkbox" id="feature3" name="features" value="Performance"> Performance</label>
        <label><input type="checkbox" id="feature4" name="features" value="Support"> Support</label>
      </fieldset>

      <!-- Written Review -->
      <label for="review">Written Review</label>
      <textarea id="review" name="review" rows="5" placeholder="Write your review here..."></textarea>

      <!-- User Name -->
      <label for="username">Your Name</label>
      <input type="text" id="username" name="username" placeholder="Optional">

      <!-- Submit Button -->
      <input type="submit" value="Submit Review">

    </form>
  </main>

  <footer>
    <p>Copyright © 2026 BYU-Pathway Worldwide</p>
  </footer>

</body>
</html>
