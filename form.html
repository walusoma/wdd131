<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Product review form">
  <meta name="author" content="Martin Walusoma">
  <title>Product Review Form</title>

  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>

  <main>
    <h1>Product Review</h1>

    <form method="get" action="review.html">

      <!-- Product Name -->
      <label for="product">Product Name</label>
      <select id="product" name="product" required>
        <option value="" disabled selected>Select a Product ...</option>
      </select>

      <!-- Overall Rating -->
      <fieldset>
        <legend>Overall Rating</legend>

        <input type="radio" id="r1" name="rating" value="1" required>
        <label for="r1">☆</label>

        <input type="radio" id="r2" name="rating" value="2">
        <label for="r2">☆☆</label>

        <input type="radio" id="r3" name="rating" value="3">
        <label for="r3">☆☆☆</label>

        <input type="radio" id="r4" name="rating" value="4">
        <label for="r4">☆☆☆☆</label>

        <input type="radio" id="r5" name="rating" value="5">
        <label for="r5">☆☆☆☆☆</label>
      </fieldset>

      <!-- Date of Installation -->
      <label for="installDate">Date of Installation</label>
      <input type="date" id="installDate" name="installDate" required>

      <!-- Useful Features -->
      <fieldset>
        <legend>Useful Features</legend>

        <input type="checkbox" id="durability" name="features" value="Durability">
        <label for="durability">Durability</label>

        <input type="checkbox" id="ease" name="features" value="Ease of Use">
        <label for="ease">Ease of Use</label>

        <input type="checkbox" id="performance" name="features" value="Performance">
        <label for="performance">Performance</label>

        <input type="checkbox" id="design" name="features" value="Design">
        <label for="design">Design</label>
      </fieldset>

      <!-- Written Review -->
      <label for="review">Written Review</label>
      <textarea id="review" name="review"></textarea>

      <!-- User Name -->
      <label for="username">Your Name (Optional)</label>
      <input type="text" id="username" name="username">

      <!-- Submit -->
      <input type="submit" value="Post Review">

    </form>
  </main>

  <footer>
    <p>&copy; 2026 | Martin Walusoma | WDD 131</p>
  </footer>

</body>
</html>
